# RAHBAR corpus: FAST-NUCES public documents (section 2). Run: make fetch
# Checked against the live site through search on 5 Nov 2026; the 2023 rules PDF did not
# open for the instructor on 1 Nov, so the Jun 2025 handbook is in as a second, verified
# superseded edition. docs/CORPUS.md maps every document to the seven properties.
#
# doc_version and superseded become chunk metadata: they are how the retriever tells the
# current rule from the repealed one (failure mode E).

documents:

  # Property 2 (two versions of one policy) + 7 (exact clause numbers)
  - name: Undergraduate Academic Rules (Aug 2023)
    url: http://nu.edu.pk/public/downloads/Academic-Rules-Undergrad-Aug-2023.pdf
    doc_version: "2023-08"
    superseded: true

  - name: Academic Rules Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Academic_Rules_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false

  # Same rules, 5 pages, different clause numbers (attendance is clause 1 here, 1.21 above)
  - name: Prospectus 2026 - Academic Rules and Regulations
    url: https://nu.edu.pk/Admissions/ProspectusUpload/Academic Rules and Regulations.pdf
    doc_version: "2026"
    superseded: false

  # Property 5: long definitions (the 12-part Generative AI policy)
  - name: Student Handbook (Jun 2026)
    url: https://nu.edu.pk/public/downloads/Student_Handbook_2026.pdf
    doc_version: "2026-06"
    superseded: false

  # Property 4: tables (faculty by campus, graduates, publications), versions over time
  - name: Annual Report 2019-20
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2019-20.pdf
    doc_version: "2019-20"
    superseded: false

  - name: Annual Report 2023-24
    url: https://nu.edu.pk/public/downloads/AnnualReportForm/Annual Report 2023-24.pdf
    doc_version: "2023-24"
    superseded: false

  # Property 4: HTML tables (tuition per credit hour, grade points)
