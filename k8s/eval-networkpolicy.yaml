apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: eval-egress
  namespace: rahbar
spec:
  podSelector:
    matchLabels:
      app: a3-eval
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api-candidate
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-eval
  namespace: rahbar
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [api, api-candidate]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: a3-eval
      ports:
        - port: 8000
          protocol: TCP
