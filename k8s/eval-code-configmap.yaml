  a3_suite.py: "import os\nimport json\nimport math\nimport time\nimport statistics\nimport
    datetime\nimport random\nfrom pathlib import Path\nimport httpx\n\nrandom.seed(42)\nHERE
    = Path(__file__).resolve().parent\nAPI = os.environ.get(\"EVAL_API\", \"http://127.0.0.1:18080/api/ask\")\n\nquestions
    = [\n    json.loads(line)\n    for line in (HERE / \"golden.jsonl\").read_text(\n
    \       encoding=\"utf-8-sig\"\n    ).splitlines() if line.strip()\n]\n\ndef mean(values):\n
    \   return statistics.mean(values) if values else None\n\ndef evaluate(noise=False):\n
    \   rows = []\n    with httpx.Client(timeout=60) as client:\n        for q in
    questions:\n            question = q[\"question\"]\n            if noise:\n                question
    = question.replace(\"the \", \"teh \").replace(\"student\", \"studnet\")\n                if
    question == q[\"question\"]:\n                    question += \" pls\"\n\n            start
    = time.perf_counter()\n            response = client.post(API, json={\"question\":
    question})\n            response.raise_for_status()\n            r = response.json()\n
    \           latency = (time.perf_counter() - start) * 1000\n\n            gold
    = {\n                (g[\"source\"], g[\"page\"])\n                for g in q.get(\"ground_truth\",
    [])\n            }\n\n            retrieved = r.get(\"retrieved\", [])\n            seen
    = set()\n            hits = []\n\n            for item in retrieved[:5]:\n                key
    = (item.get(\"source\"), item.get(\"page\"))\n                hits.append(int(key
    in gold and key not in seen))\n                seen.add(key)\n\n            citations
    = r.get(\"citations\", [])\n            valid = [\n                int(any(\n
    \                   c.get(\"source\") == t.get(\"source\")\n                    and
    c.get(\"page\") == t.get(\"page\")\n                    for t in retrieved\n                ))\n
    \               for c in citations\n            ]\n\n            row = {\n                \"id\":
    q[\"id\"],\n                \"trace_id\": r.get(\"request_id\"),\n                \"question\":
    question,\n                \"answer\": r.get(\"answer\"),\n                \"retrieved\":
    retrieved,\n                \"citations\": citations,\n                \"latency_ms\":
    latency,\n                \"cached\": r.get(\"cached\"),\n                \"citation_validity\":
    mean(valid),\n                \"must_abstain\": q.get(\"must_abstain\", False),\n
    \               \"answered\": r.get(\"answered_from_context\"),\n                \"expected_text_hit\":
    (\n                    int(q[\"expect\"].lower() in r.get(\"answer\", \"\").lower())\n
    \                   if q.get(\"expect\") else None\n                )\n            }\n\n
    \           if gold:\n                row[\"recall@3\"] = sum(hits[:3]) / len(gold)\n
    \               row[\"recall@5\"] = sum(hits) / len(gold)\n                row[\"mrr\"]
    = next(\n                    (1/(i+1) for i,h in enumerate(hits) if h), 0\n                )\n
    \               row[\"ndcg@5\"] = sum(\n                    h/math.log2(i+2) for
    i,h in enumerate(hits)\n                ) / sum(\n                    1/math.log2(i+2)
    for i in range(min(5,len(gold)))\n                )\n\n            rows.append(row)\n
    \           print(q[\"id\"], r.get(\"request_id\"), flush=True)\n\n    metrics
    = {}\n    for key in [\n        \"recall@3\", \"recall@5\", \"mrr\", \"ndcg@5\",\n
    \       \"citation_validity\", \"expected_text_hit\"\n    ]:\n        metrics[key]
    = mean([\n            r[key] for r in rows if r.get(key) is not None\n        ])\n\n
    \   metrics[\"abstention_correctness\"] = mean([\n        int(not r[\"answered\"])
    for r in rows if r[\"must_abstain\"]\n    ])\n\n    times = sorted(r[\"latency_ms\"]
    for r in rows)\n    metrics[\"latency_p50_ms\"] = statistics.median(times)\n    metrics[\"latency_p95_ms\"]
    = times[math.ceil(len(times)*0.95)-1]\n\n    return {\"metrics\": metrics, \"rows\":
    rows}\n\ndef difference(a, b):\n    return {\n        k: b[k]-v for k,v in a.items()\n
    \       if v is not None and b.get(k) is not None\n    }\n\nprint(\"RUN 1: BASELINE\")\nfirst
    = evaluate()\n\nprint(\"RUN 2: REPEATABILITY\")\nsecond = evaluate()\n\nprint(\"RUN
    3: NOISE TEST\")\nnoise = evaluate(True)\n\nresult = {\n    \"seed\": 42,\n    \"questions\":
    len(questions),\n    \"first\": first,\n    \"second\": second,\n    \"noise\":
    noise,\n    \"repeat_delta\": difference(first[\"metrics\"], second[\"metrics\"]),\n
    \   \"noise_delta\": difference(first[\"metrics\"], noise[\"metrics\"]),\n    \"limitations\":
    \"Expected text hit is not faithfulness. Cache affects repeat latency.\"\n}\n\nout
    = HERE / \"results\"\nout.mkdir(exist_ok=True)\nstamp = datetime.datetime.now(datetime.timezone.utc).strftime(\"%Y%m%dT%H%M%SZ\")\npath
    = out / f\"a3-{stamp}.json\"\npath.write_text(json.dumps(result, indent=2), encoding=\"utf-8\")\n\nprint(\"\\nBASELINE
    METRICS\")\nprint(json.dumps(first[\"metrics\"], indent=2))\nprint(\"\\nREPEATABILITY
    DIFFERENCE\")\nprint(json.dumps(result[\"repeat_delta\"], indent=2))\nprint(\"\\nNOISE
    DIFFERENCE\")\nprint(json.dumps(result[\"noise_delta\"], indent=2))\nprint(\"\\nRESULT
    SAVED:\", path)\r\n\r\n"
  gate.py: "import argparse\nimport json\nimport yaml\nfrom pathlib import Path\n\nparser
    = argparse.ArgumentParser()\nparser.add_argument(\"result\")\nparser.add_argument(\"--config\",
    default=\"eval/gate.yaml\")\nargs = parser.parse_args()\n\nresult = json.loads(\n
    \   Path(args.result).read_text(encoding=\"utf-8-sig\")\n)\nconfig = yaml.safe_load(\n
    \   Path(args.config).read_text(encoding=\"utf-8-sig\")\n)\n\nmetrics = result[\"first\"][\"metrics\"]\n\nchecks
    = [\n    (\"Recall@5\", metrics[\"recall@5\"],\n     config[\"min_recall_at_5\"],
    \">=\"),\n    (\"Citation validity\", metrics[\"citation_validity\"],\n     config[\"min_citation_validity\"],
    \">=\"),\n    (\"Abstention correctness\", metrics[\"abstention_correctness\"],\n
    \    config[\"min_abstention_correctness\"], \">=\"),\n    (\"Latency p95\", metrics[\"latency_p95_ms\"],\n
    \    config[\"max_latency_p95_ms\"], \"<=\")\n]\n\npassed = True\ndetails = []\n\nfor
    name, actual, threshold, op in checks:\n    ok = actual is not None and (\n        actual
    >= threshold if op == \">=\" else actual <= threshold\n    )\n    passed = passed
    and ok\n    print(f\"{name}: {actual} {op} {threshold}: {'PASS' if ok else 'FAIL'}\")\n
    \   details.append({\n        \"metric\": name,\n        \"actual\": actual,\n
    \       \"threshold\": threshold,\n        \"passed\": ok\n    })\n\nprint(\"REGRESSION
    GATE:\", \"PASS\" if passed else \"FAIL\")\n\nout = Path(args.result).with_suffix(\".gate.json\")\nout.write_text(json.dumps({\n
    \   \"passed\": passed,\n    \"checks\": details\n}, indent=2), encoding=\"utf-8\")\n\nraise
    SystemExit(0 if passed else 1)\r\n"
