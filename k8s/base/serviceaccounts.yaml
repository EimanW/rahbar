# One ServiceAccount per workload (section 4.7). None of RAHBAR's pods talks to the
# Kubernetes API, so none gets a token mounted and none gets a Role.
apiVersion: v1
kind: ServiceAccount
metadata: {name: rahbar-api, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rahbar-ui, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rahbar-indexer, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rahbar-chroma, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: rahbar-redis, namespace: rahbar}
automountServiceAccountToken: false
