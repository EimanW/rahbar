apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
# secret.placeholder.yaml is deliberately NOT listed: applying it would overwrite the
# real Secret created with `make secret`.
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - networkpolicy.yaml
  - chroma-statefulset.yaml
  - redis.yaml
  - api.yaml
  - ui.yaml
  - hpa.yaml
  - ingress.yaml
  - indexer-job.yaml
  - reindex-cronjob.yaml
