# One ConfigMap read by BOTH the api and the indexer (section 4.1). EMBED_MODEL lives here
# exactly once, so the two can only disagree if someone edits it and restarts one side,
# which is what the api's readiness guardrail catches (section 4.4).
apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
data:
  RETRIEVER: "chroma"
  LLM_PROVIDER: "ollama-host"          # Ollama on the laptop, reached from the cluster
  LLM_MODEL: "llama3.2:3b"
  OLLAMA_URL: "http://host.minikube.internal:11434"
  HOSTED_BASE_URL: ""                  # only for LLM_PROVIDER=hosted; key is in the Secret
  EMBED_MODEL: "nomic-embed-text"      # THE PIN: indexer and api both read this key
  CHROMA_HOST: "chroma"
  CHROMA_PORT: "8000"
  CHROMA_COLLECTION: "rahbar"
  TOP_K: "5"
  # 0.2: facts and JSON belong at 0 to 0.3; a little above 0 avoids greedy loops on a 3B
  # model. Temperature does not fix hallucination; grounding and abstention do.
  TEMPERATURE: "0.2"
  RELEVANCE_FLOOR: "0.665"              # best retrieved similarity below this -> abstain
  CACHE_THRESHOLD: "0.94"              # cosine for a semantic cache hit (docs/PIPELINE.md)
  CACHE_TTL_SECONDS: "86400"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LLM_TIMEOUT: "120"
  NUM_CTX: "8192"
  CHUNK_SIZE: "300"                    # words; measured against recall@5 (docs/PIPELINE.md)
  CHUNK_OVERLAP: "50"
  CORPUS_DIR: "/corpus"
  LOG_LEVEL: "INFO"
