# One host, two paths: / to the ui, /api to the api. The api keeps its /api prefix
# (routes/ask.py is mounted at /api), so no rewrite. Needs: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rahbar
  namespace: rahbar
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"   # a 3B model can take a while
spec:
  ingressClassName: nginx
  rules:
    - host: rahbar.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8000}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: ui, port: {number: 8080}}
