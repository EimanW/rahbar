# Documents the Secret's SHAPE only. It is NOT listed in kustomization.yaml: applying it
# would overwrite the real Secret. Create the real one from the command line:
#   export LLM_API_KEY=...   then   make secret
# which runs: kubectl create secret generic rahbar-secret -n rahbar \
#               --from-literal=LLM_API_KEY="$LLM_API_KEY"
# Base64 is encoding, not encryption: a real value here would be a leaked key.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
