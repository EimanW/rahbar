# Weekly re-index with the same image and arguments as the Job. Also the template for a
# manual re-index: kubectl create job --from=cronjob/reindex manual-reindex-1 -n rahbar
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  schedule: "17 3 * * 0"          # Sunday 03:17 (cluster time), off the hour
  concurrencyPolicy: Forbid       # never two writers at once
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {app: indexer, app.kubernetes.io/part-of: rahbar}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: rahbar-indexer
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            # The Job starts as soon as the manifests are applied, often before Chroma is
            # ready. Wait for its heartbeat (up to 5 min) instead of burning backoffLimit.
            - name: wait-for-chroma
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              command: ["python", "-c"]
              args:
                - |
                  import os, time, httpx
                  url = f"http://{os.environ['CHROMA_HOST']}:{os.environ['CHROMA_PORT']}/api/v2/heartbeat"
                  for _ in range(150):
                      try:
                          httpx.get(url, timeout=2).raise_for_status(); print("chroma is up"); break
                      except Exception as exc:
                          print("waiting for chroma:", type(exc).__name__, flush=True); time.sleep(2)
                  else:
                      raise SystemExit("chroma never became reachable")
              envFrom:
                - configMapRef: {name: rahbar-config}
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: indexer
              image: rahbar-indexer:dev
              imagePullPolicy: IfNotPresent
              args: []
              envFrom:
                - configMapRef: {name: rahbar-config}
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1536Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {}
