# minikube on a laptop: images built locally (make images) and loaded with
# `minikube image load`, so imagePullPolicy stays IfNotPresent and tags are :dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - traces-pvc.yaml
images:
  - {name: rahbar-api, newTag: dev}
  - {name: rahbar-ui, newTag: dev}
  - {name: rahbar-indexer, newTag: dev}
patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        template:
          spec:
            securityContext:
              fsGroup: 10001
            containers:
              - name: api
                env:
                  - {name: TRACE_FILE, value: /traces/queries.jsonl}
                volumeMounts:
                  - {name: traces, mountPath: /traces}
            volumes:
              - name: traces
                persistentVolumeClaim:
                  claimName: rahbar-traces
