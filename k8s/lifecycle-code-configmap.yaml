apiVersion: v1
data:
  test_lifecycle.py: "import json\nfrom pipeline.config import get_settings\nfrom
    pipeline.models import Chunk\nfrom pipeline.incremental import incremental_store\nfrom
    pipeline.store import get_client\n\nsettings = get_settings()\nclient = get_client(settings)\n\nassert
    settings.collection == \"rahbar-a3-small-test\"\n\ndef chunk(cid, text, source,
    version=\"2026-01\", superseded=False):\n    return Chunk(\n        id=cid,\n
    \       text=text,\n        source=source,\n        section=\"Policy\",\n        page=1,\n
    \       doc_version=version,\n        superseded=superseded\n    )\n\na = chunk(\"a-001\",
    \"Students must attend classes regularly.\", \"a.txt\")\nb = chunk(\"b-001\",
    \"Library closes at five.\", \"b.txt\")\nchanged = chunk(\"b-001\", \"Library
    closes at seven.\", \"b.txt\", \"2026-02\")\n\ntry:\n    client.delete_collection(settings.collection)\nexcept
    Exception:\n    pass\n\nprint(\"TEST 1: INITIAL INDEX\", flush=True)\nincremental_store([a,
    b], settings)\n\nprint(\"TEST 2: UNCHANGED DOCUMENTS\", flush=True)\nincremental_store([a,
    b], settings)\n\nprint(\"TEST 3: CHANGED DOCUMENT\", flush=True)\nincremental_store([a,
    changed], settings)\n\nprint(\"TEST 4: DELETED DOCUMENT\", flush=True)\nincremental_store([a],
    settings)\n\ncollection = client.get_collection(settings.collection)\nremaining
    = collection.get(where={\"source\": \"b.txt\"}, include=[])\n\nassert len(remaining[\"ids\"])
    == 0\nprint(\"DELETED DOCUMENT ORPHAN COUNT: 0\", flush=True)\n\nprint(\"TEST
    5: RESTORE DOCUMENT\", flush=True)\nincremental_store([a, b], settings)\n\ncollection
    = client.get_collection(settings.collection)\nassert collection.count() == 2\n\nprint(\"RESTORATION:
    PASS\", flush=True)\nprint(\"LIFECYCLE TEST COMPLETED\", flush=True)\r\n"
kind: ConfigMap
metadata:
  name: a3-lifecycle-code
  namespace: rahbar
